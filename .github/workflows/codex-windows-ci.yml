name: Codex Windows CI

on:
  push:
    branches: ["codex/ble-finder-windows"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        id: restore
        run: dotnet restore BleFinder.sln
      - name: Test
        id: test
        shell: pwsh
        run: |
          dotnet test BleFinder.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE
      - name: Publish
        id: publish
        if: success()
        shell: pwsh
        run: |
          dotnet publish src/BleFinder.App/BleFinder.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -o artifacts/publish 2>&1 | Tee-Object -FilePath publish-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem artifacts/publish -File
          $exe = @($files | Where-Object Extension -eq ".exe")
          $dll = @($files | Where-Object Extension -eq ".dll")
          if ($exe.Count -ne 1) { throw "Expected exactly one EXE, found $($exe.Count)" }
          if ($dll.Count -ne 0) { throw "Expected no DLLs, found $($dll.Count)" }
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: BleFinder-win-x64
          path: artifacts/publish/*.exe
          if-no-files-found: error
      - name: Report commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $context = "codex/windows-ci"
          if ("${{ steps.restore.outcome }}" -eq "failure") { $context = "$context/restore" }
          elseif ("${{ steps.test.outcome }}" -eq "failure") { $context = "$context/test" }
          elseif ("${{ steps.publish.outcome }}" -eq "failure") { $context = "$context/publish" }
          if ($state -eq "failure") {
            $logPath = if ("${{ steps.publish.outcome }}" -eq "failure" -and (Test-Path publish-output.txt)) { "publish-output.txt" } elseif (Test-Path test-output.txt) { "test-output.txt" } else { $null }
            if ($logPath) {
              $symbol = Select-String -Path $logPath -Pattern "error CS0246.*name '([^']+)'" | Select-Object -First 1
              $match = Select-String -Path $logPath -Pattern "error (CS[0-9]{4})" | Select-Object -First 1
              if ($symbol) { $context = "$context/CS0246/$($symbol.Matches[0].Groups[1].Value)" }
              elseif ($match) { $context = "$context/$($match.Matches[0].Groups[1].Value)" }
            }
            if ("${{ steps.test.outcome }}" -eq "failure" -and (Test-Path test-output.txt)) {
              $failure = Select-String -Path test-output.txt -Pattern "^\s*failed\s+([^\(]+?)\s+\(" | Select-Object -First 1
              if ($failure) {
                $testName = $failure.Matches[0].Groups[1].Value.Trim().Split(".")[-1]
                if ($testName.Length -gt 48) { $testName = $testName.Substring(0, 48) }
                $context = "$context/$testName"
              }
            }
          }
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context="$context" -f description="Windows test and publish: ${{ job.status }}"
